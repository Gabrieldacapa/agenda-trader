name: Real UI redesign
on:
  push:
    branches: [main]
    paths: [.github/workflows/real-ui-redesign.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply structural visual redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''<header>\n  <h1>📋 <span id="tituloNome">Agenda Trader</span></h1>\n  <small id="subtituloNome">Seu guia diário de estudos e operações</small>\n</header>\n\n<nav>\n  <button onclick="abrirTela('agenda')">Hoje</button>\n  <button onclick="abrirTela('novoJogo')">Adicionar Jogo</button>\n  <button onclick="abrirTela('estrategias')">Estratégias</button>\n  <button onclick="abrirTela('historico')">Histórico</button>\n  <button onclick="abrirTela('configuracoes')">Configurações</button>\n</nav>\n<div class="conta-barra">\n  <span id="contaEmail"></span>\n  <span id="cloudStatus">☁️ conectando...</span>\n  <button class="btn-gray" type="button" onclick="sairConta()">Sair</button>\n</div>'''
          new='''<header class="app-topo">\n  <div class="app-topo-interno">\n    <div class="app-marca">\n      <div class="app-logo">AT</div>\n      <div>\n        <h1><span id="tituloNome">Agenda Trader</span></h1>\n        <small id="subtituloNome">Agenda de estudos esportivos</small>\n      </div>\n    </div>\n    <div class="app-conta">\n      <span id="cloudStatus">☁️ conectando...</span>\n      <button class="btn-sair" type="button" onclick="sairConta()">Sair</button>\n    </div>\n  </div>\n</header>\n\n<nav class="app-nav">\n  <div class="app-nav-interno">\n    <button data-tela="agenda" class="ativo" onclick="abrirTela('agenda')">Agenda</button>\n    <button data-tela="novoJogo" onclick="abrirTela('novoJogo')">+ Novo jogo</button>\n    <button data-tela="estrategias" onclick="abrirTela('estrategias')">Estratégias</button>\n    <button data-tela="historico" onclick="abrirTela('historico')">Histórico</button>\n    <button data-tela="configuracoes" onclick="abrirTela('configuracoes')">Configurações</button>\n  </div>\n</nav>\n<div class="conta-barra conta-email-apenas">\n  <span id="contaEmail"></span>\n</div>'''
          assert old in s, 'header/nav block not found'
          s=s.replace(old,new,1)

          old='''<section id="agenda" class="ativa">\n  <h2>Agenda</h2>\n  <div class="pills">'''
          new='''<section id="agenda" class="ativa">\n  <div class="agenda-cabecalho">\n    <div>\n      <span class="agenda-kicker">VISÃO DO DIA</span>\n      <h2>Minha Agenda</h2>\n      <p>Organize seus jogos e abra cada card para consultar suas anotações.</p>\n    </div>\n    <button class="agenda-novo" type="button" onclick="abrirTela('novoJogo')">+ Adicionar jogo</button>\n  </div>\n  <div class="pills">'''
          assert old in s, 'agenda heading block not found'
          s=s.replace(old,new,1)

          marker='\n</style>'
          css=r'''

/* ===== Redesign estrutural 2026 ===== */
body.tema-claro{background:#f6f8fc!important}
body.tema-claro .app-topo{position:static!important;background:#ffffff!important;border:0!important;box-shadow:none!important;padding:0!important}
body.tema-claro .app-topo-interno{max-width:1120px;margin:auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
body.tema-claro .app-marca{display:flex;align-items:center;gap:13px}
body.tema-claro .app-logo{width:46px;height:46px;border-radius:14px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;box-shadow:0 8px 20px rgba(37,99,235,.22)}
body.tema-claro .app-marca h1{margin:0!important;font-size:21px!important;line-height:1.15;color:#111827!important}
body.tema-claro .app-marca small{display:block;margin-top:4px;color:#94a3b8!important;font-size:12px}
body.tema-claro .app-conta{display:flex;align-items:center;gap:12px;color:#64748b;font-size:12px}
body.tema-claro .btn-sair{background:#f1f5f9!important;color:#475569!important;border:0!important;border-radius:10px!important;padding:8px 12px!important}
body.tema-claro .app-nav{position:static!important;top:auto!important;background:transparent!important;border:0!important;box-shadow:none!important;padding:0 20px!important}
body.tema-claro .app-nav-interno{max-width:1120px;margin:auto;background:#fff;border:1px solid #e8edf4;border-radius:15px;padding:6px;display:flex;gap:5px;box-shadow:0 5px 16px rgba(15,23,42,.04)}
body.tema-claro .app-nav button{flex:0 0 auto;background:transparent!important;border:0!important;border-radius:10px!important;color:#64748b!important;padding:10px 15px!important;font-size:13px;font-weight:750}
body.tema-claro .app-nav button.ativo{background:#2563eb!important;color:#fff!important;box-shadow:0 4px 12px rgba(37,99,235,.2)}
body.tema-claro .conta-email-apenas{max-width:1120px!important;margin:6px auto 0!important;padding:0 22px!important;border:0!important;background:transparent!important;color:#94a3b8!important;min-height:18px;justify-content:flex-end!important}
body.tema-claro .container{max-width:1120px!important;padding:24px 20px 48px!important}
body.tema-claro .agenda-cabecalho{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:2px 0 22px}
body.tema-claro .agenda-cabecalho h2{margin:3px 0 5px!important;font-size:29px!important;letter-spacing:-.7px!important;color:#0f172a!important}
body.tema-claro .agenda-cabecalho p{margin:0;color:#718096;font-size:13px}
body.tema-claro .agenda-kicker{font-size:10px;font-weight:900;letter-spacing:1.4px;color:#2563eb}
body.tema-claro .agenda-novo{background:#2563eb!important;color:#fff!important;border:0!important;border-radius:11px!important;padding:11px 16px!important;font-weight:800!important;box-shadow:0 6px 16px rgba(37,99,235,.18)}
body.tema-claro .pills{margin:0 0 14px!important;padding:0!important}
body.tema-claro .pills button{border-radius:10px!important;padding:8px 13px!important;font-size:12px!important}
body.tema-claro .filtros-agenda{border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important;display:grid!important;grid-template-columns:1.5fr 1fr 1fr!important;margin-bottom:20px!important}
body.tema-claro .filtros-agenda input,body.tema-claro .filtros-agenda select{height:44px!important;background:#fff!important;border:1px solid #e4e9f0!important}
body.tema-claro #tituloAgenda h3{font-size:15px!important;color:#64748b!important;margin:12px 0!important}
body.tema-claro #listaAgenda>.card{border:1px solid #e6ebf2!important;border-radius:18px!important;box-shadow:0 4px 14px rgba(15,23,42,.04)!important;padding:16px 18px!important}
body.tema-claro #listaAgenda>.card:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(15,23,42,.07)!important;border-color:#cfd8e6!important}
body.tema-claro .jogo-resumo{min-height:82px!important}
body.tema-claro .jogo-confronto{font-size:19px!important;color:#111827!important}
body.tema-claro .vazio{padding:42px 20px!important;background:#fff!important;border:1px dashed #d9e2ee!important;color:#94a3b8!important}
@media(max-width:760px){
  body.tema-claro .app-topo-interno{padding:16px 12px}
  body.tema-claro .app-logo{width:40px;height:40px;border-radius:12px}
  body.tema-claro .app-conta #cloudStatus{display:none}
  body.tema-claro .app-nav{padding:0 10px!important;overflow-x:auto!important}
  body.tema-claro .app-nav-interno{width:max-content;min-width:100%;overflow:visible}
  body.tema-claro .app-nav button{padding:9px 12px!important;font-size:12px!important}
  body.tema-claro .conta-email-apenas{display:none!important}
  body.tema-claro .container{padding:18px 12px 36px!important}
  body.tema-claro .agenda-cabecalho{align-items:flex-start;margin-bottom:17px}
  body.tema-claro .agenda-cabecalho h2{font-size:24px!important}
  body.tema-claro .agenda-cabecalho p{display:none}
  body.tema-claro .agenda-novo{padding:9px 11px!important;font-size:12px!important}
  body.tema-claro .filtros-agenda{grid-template-columns:1fr!important;gap:8px!important}
  body.tema-claro .pills{display:flex!important;overflow-x:auto!important;white-space:nowrap;padding-bottom:3px!important}
}
'''
          assert marker in s
          s=s.replace(marker,css+marker,1)

          old='''function abrirTela(id){\n  document.querySelectorAll("section").forEach(s=>s.classList.remove("ativa"));\n  document.getElementById(id).classList.add("ativa");'''
          new='''function abrirTela(id){\n  document.querySelectorAll("section").forEach(s=>s.classList.remove("ativa"));\n  document.getElementById(id).classList.add("ativa");\n  document.querySelectorAll(".app-nav button[data-tela]").forEach(b=>b.classList.toggle("ativo",b.dataset.tela===id));'''
          assert old in s, 'abrirTela block not found'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          import re
          w=re.sub(r'const CACHE_NAME = "agenda-trader-v\d+";', 'const CACHE_NAME = "agenda-trader-v34";', w, count=1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/real-ui-redesign.yml
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: rebuild main interface with modern clear layout"
          git push
# trigger: 2026-08-21
