name: Finalize modern light theme
on:
  push:
    branches: [design/light-modern-cards]
    paths:
      - .github/workflows/apply-modern-light.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/light-modern-cards
      - name: Inline CSS and remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=Path('modern-light.css').read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="./modern-light.css">\n\n','',1)
          marker='</style>'
          assert marker in s
          s=s.replace(marker,'\n/* ===== Visual moderno claro ===== */\n'+css+'\n'+marker,1)
          s=s.replace('const tema=cfg.tema||"escuro";','const tema=cfg.tema||"claro";',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm modern-light.css
          rm .github/workflows/apply-modern-light.yml
      - name: Commit final design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: finalize clean modern light theme"
          git push origin design/light-modern-cards
