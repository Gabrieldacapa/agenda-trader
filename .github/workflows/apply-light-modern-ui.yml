name: Apply light modern UI
on:
  push:
    branches: [design/light-modern-cards]
    paths: [.github/workflows/apply-light-modern-ui.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css=r'''
/* Visual claro moderno — camada somente de apresentação */
:root{--bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--line:#e2e8f0;--text:#172033;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8}
body,body.tema-claro{background:#f5f7fb!important;color:#172033!important}
header,body.tema-claro header{background:rgba(255,255,255,.96)!important;border-color:#e5e7eb!important;box-shadow:0 1px 10px rgba(15,23,42,.05)}
header h1{color:#172033!important} header small{color:#64748b!important}
nav,body.tema-claro nav{background:#fff!important;border-color:#e5e7eb!important;padding:12px}
nav button,body.tema-claro nav button{background:#f8fafc!important;color:#334155!important;border:1px solid #e2e8f0!important;border-radius:12px}
nav button:hover,body.tema-claro nav button:hover{background:#eff6ff!important;color:#1d4ed8!important;border-color:#bfdbfe!important}
.container{max-width:1120px;padding:22px}
.card,body.tema-claro .card{background:#fff!important;color:#172033!important;border:1px solid #e5e7eb!important;border-radius:16px;box-shadow:0 4px 18px rgba(15,23,42,.055);transition:transform .18s,box-shadow .18s,border-color .18s}
#listaAgenda>.card:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(15,23,42,.09);border-color:#bfdbfe!important}
.jogo-resumo{padding:2px 4px}.hora{color:#2563eb!important;font-size:21px}.data{color:#64748b!important}.jogo-confronto{color:#172033!important;font-size:18px}.jogo-seta{color:#94a3b8!important}
.jogo-detalhes{border-color:#e5e7eb!important}.info,.nota,.progresso-txt{color:#64748b!important}
.pills{gap:10px;margin:14px 0 18px}.pills button{background:#fff!important;color:#334155!important;border:1px solid #dbe3ee!important;padding:11px 18px;border-radius:12px;font-weight:800;box-shadow:0 2px 8px rgba(15,23,42,.035)}.pills button:hover{background:#eff6ff!important;color:#1d4ed8!important;border-color:#93c5fd!important}
input,textarea,select,body.tema-claro input,body.tema-claro textarea,body.tema-claro select{background:#fff!important;color:#172033!important;border:1px solid #dbe3ee!important;border-radius:11px}input:focus,textarea:focus,select:focus{border-color:#60a5fa!important;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
label,body.tema-claro label{color:#475569!important}.filtros-agenda{background:#fff;padding:12px;border:1px solid #e5e7eb;border-radius:14px}
.btn-main{background:#2563eb!important;color:#fff!important}.btn-blue{background:#eaf2ff!important;color:#1d4ed8!important}.btn-edit{background:#fff7ed!important;color:#c2410c!important}.btn-del{background:#fff1f2!important;color:#be123c!important}.btn-gray{background:#f1f5f9!important;color:#475569!important}
.badge{background:#eef2ff!important;color:#4338ca!important;border:1px solid #e0e7ff;font-size:12px}.prio-alta{background:#dcfce7!important;color:#15803d!important}.prio-observar{background:#dbeafe!important;color:#1d4ed8!important}.prio-live{background:#fef3c7!important;color:#b45309!important}.prio-descartado{background:#f1f5f9!important;color:#64748b!important}
.box,.estudo,.observar,.alerta,.stats,.ponto-principal{color:#334155!important;border-radius:12px}.estudo{background:#f0fdf4!important}.observar{background:#eff6ff!important}.alerta{background:#fffbeb!important}.stats{background:#faf5ff!important}.ponto-principal{background:#ecfeff!important}
.conta-barra{background:#fff!important;border-color:#e5e7eb!important;color:#475569!important}
@media(max-width:760px){.container{padding:12px}.card{border-radius:14px}.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pills button{padding:10px 4px;font-size:11px}.filtros-agenda{padding:9px}.jogo-resumo{gap:8px}.hora{font-size:18px}.jogo-confronto{font-size:16px}}
'''
          assert marker in s
          s=s.replace(marker,css+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit visual patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: apply clean light modern interface"
          git push
