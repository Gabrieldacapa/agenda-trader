name: Add yesterday view
on:
  push:
    branches: [main]
    paths: [.github/workflows/add-yesterday-view.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''  <div class="pills">\n    <button onclick="mudarDias(0)">Hoje</button>'''
          new='''  <div class="pills">\n    <button onclick="mudarDias(-1)">Ontem</button>\n    <button onclick="mudarDias(0)">Hoje</button>'''
          assert old in s, 'agenda buttons insertion point not found'
          s=s.replace(old,new,1)

          old='''  const nomes=["Hoje","Amanhã","Daqui a 2 dias","Daqui a 3 dias"];\n  tituloAgenda.innerHTML=`<h3>${nomes[diasAgenda]} — <span style="color:var(--blue)">${formatarData(alvo)}</span></h3>`;'''
          new='''  const nomes={"-1":"Ontem","0":"Hoje","1":"Amanhã","2":"Daqui a 2 dias","3":"Daqui a 3 dias"};\n  tituloAgenda.innerHTML=`<h3>${nomes[String(diasAgenda)]||"Agenda"} — <span style="color:var(--blue)">${formatarData(alvo)}</span></h3>`;'''
          assert old in s, 'agenda title insertion point not found'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add yesterday view to agenda"
          git push
