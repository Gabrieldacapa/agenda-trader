name: Migrate existing users to light theme
on:
  push:
    branches: [main]
    paths: [.github/workflows/migrate-light-theme.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time theme migration and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''function carregarConfiguracoes(){\n  const cfg=JSON.parse(localStorage.getItem("agendaTraderConfig")||"{}");\n  const tema=cfg.tema||"claro";\n  document.body.classList.toggle("tema-claro",tema==="claro");\n  if(document.getElementById("temaConfig"))temaConfig.value=tema;\n  if(document.getElementById("nomeAgendaConfig"))nomeAgendaConfig.value=cfg.nomeAgenda||"Agenda Trader";\n  if(document.getElementById("nomeUsuarioConfig"))nomeUsuarioConfig.value=cfg.nomeUsuario||"";\n  atualizarTitulo(cfg);\n}\nfunction salvarConfiguracoes(){\n  const atual=JSON.parse(localStorage.getItem("agendaTraderConfig")||"{}");\n  const cfg={\n    tema:document.getElementById("temaConfig")?.value||atual.tema||"escuro",\n    nomeAgenda:document.getElementById("nomeAgendaConfig")?.value.trim()||atual.nomeAgenda||"Agenda Trader",\n    nomeUsuario:document.getElementById("nomeUsuarioConfig")?.value.trim()||""\n  };'''
          new='''function carregarConfiguracoes(){\n  const cfg=JSON.parse(localStorage.getItem("agendaTraderConfig")||"{}");\n  if(!cfg.visualClaroV2){\n    cfg.tema="claro";\n    cfg.visualClaroV2=true;\n    localStorage.setItem("agendaTraderConfig",JSON.stringify(cfg));\n  }\n  const tema=cfg.tema||"claro";\n  document.body.classList.toggle("tema-claro",tema==="claro");\n  if(document.getElementById("temaConfig"))temaConfig.value=tema;\n  if(document.getElementById("nomeAgendaConfig"))nomeAgendaConfig.value=cfg.nomeAgenda||"Agenda Trader";\n  if(document.getElementById("nomeUsuarioConfig"))nomeUsuarioConfig.value=cfg.nomeUsuario||"";\n  atualizarTitulo(cfg);\n}\nfunction salvarConfiguracoes(){\n  const atual=JSON.parse(localStorage.getItem("agendaTraderConfig")||"{}");\n  const cfg={\n    tema:document.getElementById("temaConfig")?.value||atual.tema||"claro",\n    nomeAgenda:document.getElementById("nomeAgendaConfig")?.value.trim()||atual.nomeAgenda||"Agenda Trader",\n    nomeUsuario:document.getElementById("nomeUsuarioConfig")?.value.trim()||"",\n    visualClaroV2:true\n  };'''
          assert old in s, 'config block not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('const CACHE_NAME = "agenda-trader-v32";','const CACHE_NAME = "agenda-trader-v33";',1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/migrate-light-theme.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: migrate existing users to modern light theme"
          git push
