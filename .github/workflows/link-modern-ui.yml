name: Link modern UI preview
on:
  push:
    branches: [design/real-neutral-redesign]
    paths: [.github/workflows/link-modern-ui.yml]
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/real-neutral-redesign
      - name: Link visual stylesheet only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<link rel="manifest" href="./manifest.webmanifest">'
          if './modern-ui.css' not in s:
            s=s.replace(marker,'<link rel="stylesheet" href="./modern-ui.css">\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove this temporary workflow
        run: rm .github/workflows/link-modern-ui.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: enable new visual preview"
          git push origin design/real-neutral-redesign
